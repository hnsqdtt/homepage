# 生产编排(design/07):app + watchtower 两个容器;可变数据只在 ./data。
# 80/443 归宿主机 Caddy(整机网关,import 本目录 Caddyfile),app 仅对回环暴露 3000。
services:
  app:
    image: ghcr.io/hnsqdtt/homepage:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
    mem_limit: 768m
    labels:
      # 一键更新只圈定本容器(watchtower LABEL_ENABLE 模式)
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      # slim 镜像无 curl,用 node 自带 fetch 探测
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 一键更新执行器(design/05 健康页):HTTP API 触发模式(不定时轮询),
  # 只更新打了标签的容器;不映射端口,仅 compose 内网可达,经 WATCHTOWER_TOKEN 鉴权
  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    environment:
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      # 1.7.1 默认协商到过老的 API 版本,新版 Docker 守护进程(min 1.40)会拒绝;固定一个兼容值
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 64m
