# 生产编排(design/07):Caddy + app 两个容器;可变数据只在 ./data。
services:
  app:
    image: ghcr.io/hnsqdtt/homepage:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    mem_limit: 768m
    healthcheck:
      # slim 镜像无 curl,用 node 自带 fetch 探测
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/srv/site-data:ro # 只读挂载,直接伺服 uploads 与 pages
      - caddy_data:/data # Caddy 证书存储
      - caddy_config:/config

volumes:
  caddy_data: {}
  caddy_config: {}
